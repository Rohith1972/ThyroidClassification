spring.application.name=ThyroidSystem
server.port=${BACKEND_PORT:8080}

# MongoDB — value comes from environment variable / .env
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/thyroid_db}
spring.data.mongodb.auto-index-creation=true

# JWT — secrets loaded from environment variables (never hardcode here)
thyroid.app.jwtSecret=${THYROID_JWT_SECRET}
thyroid.app.jwtExpirationMs=${THYROID_JWT_EXPIRATION_MS:86400000}

# AI Gateway Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Actuator Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.thyroid.system=DEBUG
